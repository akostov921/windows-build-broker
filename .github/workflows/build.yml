name: Confidential Windows build
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: confidential-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install authenticated-encryption library
        shell: pwsh
        run: python -m pip install --disable-pip-version-check cryptography==46.0.5
      - name: Build private inputs and encrypt outputs
        id: private
        shell: pwsh
        env:
          INPUT_0: ${{ secrets.INPUT_0 }}
          INPUT_1: ${{ secrets.INPUT_1 }}
          INPUT_2: ${{ secrets.INPUT_2 }}
          INPUT_3: ${{ secrets.INPUT_3 }}
          INPUT_4: ${{ secrets.INPUT_4 }}
          INPUT_5: ${{ secrets.INPUT_5 }}
          INPUT_6: ${{ secrets.INPUT_6 }}
          INPUT_7: ${{ secrets.INPUT_7 }}
          INPUT_8: ${{ secrets.INPUT_8 }}
          INPUT_9: ${{ secrets.INPUT_9 }}
          INPUT_SHA256: ${{ secrets.INPUT_SHA256 }}
          OUTPUT_KEY: ${{ secrets.OUTPUT_KEY }}
          PYTHONUTF8: '1'
        run: python broker.py
      - name: Publish encrypted result only
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (!(Test-Path 'build-output.aes256gcm')) { throw 'No encrypted bundle was produced.' }
          gh release create "build-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" build-output.aes256gcm --repo "$env:GITHUB_REPOSITORY" --title "Encrypted build $env:GITHUB_RUN_ID attempt $env:GITHUB_RUN_ATTEMPT" --notes 'Encrypted output. No application source or plaintext binaries are published.'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Report verification result
        if: steps.private.outputs.passed != 'true'
        shell: pwsh
        run: throw 'Private build failed. The encrypted diagnostic bundle is available to its key holder.'
